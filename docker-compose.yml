services:
  backend:
    build: ./backend
    init: true
    environment:
      CORS_ORIGIN: http://localhost:8000

  frontend:
    build: ./frontend

  proxy:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./local-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend